# Configuration de base = PRODUCTION.
# En local, compose.override.yaml est chargé automatiquement par-dessus (mode dev).
# Sur le VPS, COMPOSE_FILE=compose.yaml dans .env désactive l'override.

services:
  php:
    build:
      context: .
      target: app_prod
    image: wecare-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET doit être défini dans .env}
      DATABASE_URL: mysql://wecare:${DB_PASSWORD:-wecare}@database:3306/wecare?serverVersion=11.4.0-MariaDB&charset=utf8mb4
      DEFAULT_URI: ${DEFAULT_URI:-https://localhost}
    depends_on:
      database:
        condition: service_healthy

  caddy:
    build:
      context: .
      target: caddy_prod
    image: wecare-caddy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@wecare.fr}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificats Let's Encrypt persistés : pas de nouvelle demande à chaque redémarrage
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wecare
      MARIADB_USER: wecare
      MARIADB_PASSWORD: ${DB_PASSWORD:-wecare}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro

  # Chargement des données de démonstration (fixtures) — à la demande uniquement :
  #   docker compose --profile demo run --rm fixtures
  # Utilise l'image dev (le bundle de fixtures n'est pas installé dans l'image prod).
  fixtures:
    profiles: [demo]
    build:
      context: .
      target: app_dev
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://wecare:${DB_PASSWORD:-wecare}@database:3306/wecare?serverVersion=11.4.0-MariaDB&charset=utf8mb4
    command: ["php", "bin/console", "doctrine:fixtures:load", "--no-interaction"]
    depends_on:
      database:
        condition: service_healthy

volumes:
  database_data:
  caddy_data:
  caddy_config:
